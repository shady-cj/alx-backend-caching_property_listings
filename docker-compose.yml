
version: "3.9"

services:
  postgreSQL:
    image: postgres:latest
    restart: always
    env_file:
      - .env
    secrets:
      - postgres_password
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: /run/secrets/postgres_password
    ports:
      - "5432:5432"
    volumes: 
      - postgres_data:/var/lib/postgresql/data



  Redis:
    image: redis:latest
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  - redis_data
  - postgres_data


secrets:
  postgres_password:
    file: ./postgres_password.txt